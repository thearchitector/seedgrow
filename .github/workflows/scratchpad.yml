name: Runner ISA smoke

on:
  push:
    branches: [ci/runner-isa-smoke]
    paths:
      - .github/workflows/scratchpad.yml
      - tools/ci/isa_smoke.cpp
      - tools/ci/runner_isa.py
      - tools/resource_guard.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seedgrow-runner-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compare compiled scalar and admitted EVEX with generated signed-dot vectors
        shell: bash
        run: |
          ulimit -c 0
          r="$RUNNER_TEMP/seedgrow-isa"
          python3 -IB tools/resource_guard.py --wall-seconds 0 --log "$r/guard.json" -- \
            python3 -IB tools/ci/runner_isa.py run "$r"
          python3 -IB tools/ci/runner_isa.py verify "$r" --commit "$GITHUB_SHA"
      - name: Return only receipts and synthetic lane values
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-isa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/seedgrow-isa/guard.json
            ${{ runner.temp }}/seedgrow-isa/result.json
            ${{ runner.temp }}/seedgrow-isa/scalar.u32
            ${{ runner.temp }}/seedgrow-isa/evex.u32
          if-no-files-found: error
          retention-days: 7
